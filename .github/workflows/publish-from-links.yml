name: Publish Instagram posts from links

on:
  push:
    paths:
      - "posts.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Neue Links verarbeiten
        run: python scripts/publish_from_links.py

      - name: Änderungen committen
        run: |
          git config user.name "bwl-hockey-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _posts assets/instagram _data/processed_posts.json
          git diff --staged --quiet || git commit -m "Neue Instagram-Posts veröffentlicht"
          git push
